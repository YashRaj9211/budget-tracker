<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/budget-tracker-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Offline-first personal budget tracker" />
  <link rel="apple-touch-icon" href="/budget-tracker-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget Tracker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
    
  <title>Budget Tracker</title>
  <style>
    /* Splash Screen Styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      border: 3px solid #000000;
      padding: 2.5rem;
      background-color: #bde2ff; /* Pastel blue */
      box-shadow: 6px 6px 0px #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      width: 320px;
      text-align: center;
      transform: scale(1);
      animation: splash-entrance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      animation: pulse-logo 2s infinite ease-in-out;
    }

    .splash-title {
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 1.75rem;
      color: #000000;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .splash-subtitle {
      font-family: 'Rubik', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      color: #333333;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Neobrutalist Progress Bar */
    .splash-loader-container {
      border: 2px solid #000000;
      height: 12px;
      width: 140px;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-bar {
      height: 100%;
      background: #fecaca; /* Pastel pink */
      border-right: 2px solid #000000;
      position: absolute;
      top: 0;
      left: 0;
      width: 30%;
      animation: loader-slide 1.5s infinite linear;
    }

    @keyframes splash-entrance {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes pulse-logo {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes loader-slide {
      0% {
        left: -35%;
        width: 30%;
      }
      50% {
        width: 45%;
      }
      100% {
        left: 105%;
        width: 30%;
      }
    }
  </style>
  <script>
    window.hideSplashScreen = function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          splash.remove();
        }, 400);
      }
    };
  </script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-card">
      <img class="splash-logo" src="/budget-tracker-icon.svg" alt="Budget Tracker Logo" />
      <h1 class="splash-title">BUDGET TRACKER</h1>
      <div class="splash-loader-container">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
