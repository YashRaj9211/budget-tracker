<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/budget-tracker-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Offline-first personal budget tracker" />
  <link rel="apple-touch-icon" href="/budget-tracker-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget Tracker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
    
  <title>Budget Tracker</title>
  <style>
    /* Soft Mint Splash Screen Styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F4F6F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      border: 1px solid rgba(30, 30, 30, 0.06);
      border-radius: 32px;
      padding: 2.5rem 2rem;
      background-color: #FFFFFF;
      box-shadow: 0 20px 48px -12px rgba(30, 30, 30, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      width: 320px;
      text-align: center;
      animation: splash-entrance 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 1.25rem;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(168, 245, 162, 0.5);
      animation: logo-float 2.4s ease-in-out infinite;
    }

    .splash-title {
      font-family: 'Poppins', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 1.35rem;
      color: #1E1E1E;
      margin-top: 0;
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }

    .splash-subtitle {
      font-family: 'Poppins', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 0.8125rem;
      color: #555A54;
      margin-bottom: 1.75rem;
    }

    .splash-loader-container {
      border-radius: 9999px;
      height: 6px;
      width: 160px;
      background: #EEF1EB;
      overflow: hidden;
      position: relative;
      margin-bottom: 0.75rem;
    }

    .splash-loader-bar {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #A8F5A2 0%, #7FEA79 60%, #AFA0F8 100%);
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      animation: loader-slide 1.3s infinite ease-in-out;
    }

    .splash-status {
      font-family: 'Poppins', -apple-system, sans-serif;
      font-size: 0.75rem;
      color: #7D847B;
      font-weight: 500;
    }

    .splash-tag {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F4F6F3;
      border-radius: 9999px;
      padding: 5px 14px;
      font-family: 'Poppins', -apple-system, sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      color: #555A54;
    }

    .splash-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2E7D32;
      box-shadow: 0 0 6px rgba(46, 125, 50, 0.4);
    }

    @keyframes splash-entrance {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes logo-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes loader-slide {
      0% {
        left: -45%;
        width: 35%;
      }
      50% {
        width: 55%;
      }
      100% {
        left: 100%;
        width: 35%;
      }
    }
  </style>
  <script>
    window.hideSplashScreen = function() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          splash.remove();
        }, 350);
      }
    };
    // Auto-dismiss safety timeout so the app never hangs on load
    setTimeout(function() {
      window.hideSplashScreen();
    }, 1500);
  </script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-card">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="/budget-tracker-icon.svg" alt="Divvit Budget" />
      </div>
      <h1 class="splash-title">Divvit Budget</h1>
      <p class="splash-subtitle">Smart daily tracking &amp; splits</p>
      <div class="splash-loader-container">
        <div class="splash-loader-bar"></div>
      </div>
      <div class="splash-status">Loading your workspace…</div>
      <div class="splash-tag">
        <span class="splash-dot"></span>
        Offline-first ready
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
