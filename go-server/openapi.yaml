openapi: 3.0.0
info:
  title: Divit Go Server API
  description: API documentation for the Divit Clone Go Server Backend
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/Prod
    description: AWS API Gateway

paths:
  /api/_public/v1/users/signup:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpBody'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request

  /api/_public/v1/users/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials

  /api/_private/v1/dashboard:
    get:
      summary: Totals for the signed-in user
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Summary
        '401':
          description: Missing or invalid token

  /api/_private/v1/dashboard/expenses:
    get:
      summary: Daily expense breakdown
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Breakdown
        '401':
          description: Missing or invalid token

  /api/_private/v1/dashboard/friends:
    get:
      summary: Who you owe and who owes you
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balances
        '401':
          description: Missing or invalid token

  /api/_private/v1/dashboard/graph:
    get:
      summary: Daily spend graph data (?period=WEEK|MONTH)
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Graph data
        '401':
          description: Missing or invalid token

  /api/_private/v1/dashboard/analytics:
    get:
      summary: Chart data - monthly trend, categories and groups (?months=1..12, default 6)
      tags: [Dashboard]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: months
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '400':
          description: months out of range
        '401':
          description: Missing or invalid token

  /api/_private/v1/categories:
    get:
      summary: List expense categories (shared by all users), sorted by name
      tags: [Expenses]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    icon: {type: string}
                    color: {type: string}
        '401':
          description: Missing or invalid token

  /api/_private/v1/expenses:
    post:
      summary: Create an expense (user comes from the token)
      tags: [Expenses]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseBody'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid input (amount, splits, type ...)
        '403':
          description: Not allowed (not a group member / not a friend)
        '404':
          description: Not found
    get:
      summary: List my expenses
      tags: [Expenses]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          description: Missing or invalid token

  /api/_private/v1/expenses/{expenseId}:
    put:
      summary: Update an expense (payer or group member)
      tags: [Expenses]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid input (amount, splits, type ...)
        '403':
          description: Not allowed (not a group member / not a friend)
        '404':
          description: Not found
    delete:
      summary: Delete an expense (payer or group member)
      tags: [Expenses]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or invalid token
        '403':
          description: Not allowed
        '404':
          description: Not found

  /api/_private/v1/expenses/settle/{splitId}:
    put:
      summary: Mark my own share as paid
      tags: [Expenses]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: splitId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Split settled
        '401':
          description: Missing or invalid token
        '403':
          description: Not your split
        '404':
          description: Split not found

  /api/_private/v1/friendships/send:
    post:
      summary: Send a friend request by email
      tags: [Friendships]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendshipRequestBody'
      responses:
        '200':
          description: Request sent
        '401':
          description: Missing or invalid token
        '404':
          description: No user with that email
        '409':
          description: Already requested / already friends

  /api/_private/v1/friendships/accept/{friendId}:
    post:
      summary: Accept a friend request
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
        '401':
          description: Missing or invalid token

  /api/_private/v1/friendships/reject/{friendId}:
    post:
      summary: Reject a friend request
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rejected
        '401':
          description: Missing or invalid token

  /api/_private/v1/friendships:
    get:
      summary: All my friendships
      tags: [Friendships]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Friendships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friendship'
        '401':
          description: Missing or invalid token

  /api/_private/v1/friends:
    get:
      summary: My accepted friends
      tags: [Friendships]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Friends
        '401':
          description: Missing or invalid token

  /api/_private/v1/split/overview:
    get:
      summary: All my groups (with members) and all their expenses in one call
      tags: [Groups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitOverview'
        '401':
          description: Missing or invalid token

  /api/_private/v1/groups:
    post:
      summary: Create a group (memberIds must be accepted friends)
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupBody'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid name or a member is not your friend
    get:
      summary: List my groups
      tags: [Groups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: { groups: [...] }
        '401':
          description: Missing or invalid token

  /api/_private/v1/groups/{groupId}:
    get:
      summary: Expenses of a group (members only)
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member
    delete:
      summary: Delete a group (admin only)
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/_private/v1/groups/{groupId}/toggle-simplify:
    put:
      summary: Turn simplified debts on/off
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Toggled
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member

  /api/_private/v1/groups/{groupId}/members:
    get:
      summary: Members of a group
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member

  /api/_private/v1/groups/{groupId}/members/{userId}:
    post:
      summary: Add a friend to the group
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Added
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member, or target is not your accepted friend
    delete:
      summary: Remove a member (admin only; cannot remove the last admin)
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed
        '401':
          description: Missing or invalid token
        '400':
          description: Would leave the group without an admin
        '403':
          description: Not an admin
        '404':
          description: Not a member

  /api/_private/v1/groups/{groupId}/leave:
    delete:
      summary: Leave a group (another member becomes admin if you were the last admin)
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left
        '401':
          description: Missing or invalid token
        '404':
          description: Not a member

  /api/_private/v1/salary:
    get:
      summary: List salary history (newest first)
      tags: [Salary]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Salary history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaryEntry'
        '401':
          description: Missing or invalid token
    post:
      summary: Add a salary entry
      tags: [Salary]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalaryBody'
      responses:
        '201':
          description: Salary entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryEntry'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid token

  /api/_private/v1/salary/active:
    get:
      summary: Get active salary for a month (?month=YYYY-MM)
      tags: [Salary]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
            example: '2026-07'
      responses:
        '200':
          description: Active salary
        '400':
          description: Invalid month format
        '401':
          description: Missing or invalid token

  /api/_private/v1/salary/{id}:
    put:
      summary: Edit a salary entry
      tags: [Salary]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalaryBody'
      responses:
        '200':
          description: Salary entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryEntry'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid token
        '404':
          description: Salary entry not found
    delete:
      summary: Soft delete a salary entry
      tags: [Salary]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or invalid token
        '404':
          description: Salary entry not found

  /api/_private/v1/savings-accounts:
    get:
      summary: List all savings accounts with calculated balances
      tags: [Savings]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Accounts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavingsAccount'
        '401':
          description: Missing or invalid token
    post:
      summary: Create a savings account
      tags: [Savings]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavingsAccountBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsAccount'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid token

  /api/_private/v1/savings-accounts/{id}:
    get:
      summary: Get savings account by ID
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsAccount'
        '401':
          description: Missing or invalid token
        '404':
          description: Account not found
    put:
      summary: Update a savings account
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavingsAccountBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsAccount'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid token
        '404':
          description: Account not found
    delete:
      summary: Soft delete a savings account and its transactions
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or invalid token
        '404':
          description: Account not found

  /api/_private/v1/savings-accounts/{id}/transactions:
    get:
      summary: List transactions for an account
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavingsTransaction'
        '401':
          description: Missing or invalid token
        '404':
          description: Account not found
    post:
      summary: Add a transaction (deposit or withdrawal)
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavingsTransactionBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsTransaction'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid token
        '404':
          description: Account not found

  /api/_private/v1/savings-accounts/{id}/transactions/{txnId}:
    delete:
      summary: Soft delete a transaction
      tags: [Savings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: txnId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or invalid token
        '404':
          description: Transaction not found

  /api/_private/v1/finance-summary:
    get:
      summary: Get monthly finance summary (salary, spend, budget, savings)
      tags: [FinanceSummary]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: month
          required: false
          schema:
            type: string
            example: '2026-07'
          description: Target month in YYYY-MM format. Defaults to current month.
      responses:
        '200':
          description: Monthly summary metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSummaryResponse'
        '400':
          description: Invalid month format
        '401':
          description: Missing or invalid token

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send "Authorization Bearer <token>" (or the x-token header). The user is always taken from the token.

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        username:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        simplifyDebts:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'

    GroupMember:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    Expense:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
          description: Decimal string
        currency:
          type: string
        description:
          type: string
        note:
          type: string
        type:
          type: string
          enum: [PERSONAL, SPLIT, INCOME]
        expenseDate:
          type: string
          format: date-time
        userId:
          type: string
        categoryId:
          type: string
        groupId:
          type: string
        isSettlement:
          type: boolean
          description: true for a settle-up payment between two members
        includeInBudget:
          type: boolean
          description: Whether this transaction counts toward the budget (defaults to true)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        user:
          $ref: '#/components/schemas/User'

    ExpenseSplit:
      type: object
      properties:
        id:
          type: string
        expenseId:
          type: string
        userId:
          type: string
        amount:
          type: string
          description: Decimal string
        splitType:
          type: string
          enum: [EQUAL, EXACT, PERCENTAGE, SHARES]
        percentage:
          type: string
        isPaid:
          type: boolean
        createdAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    Friendship:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        friendId:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        friend:
          $ref: '#/components/schemas/User'

    FriendBalance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
        amount:
          type: string
          description: Decimal string

    SignUpBody:
      type: object
      required: [email, name, username, password]
      properties:
        email:
          type: string
        name:
          type: string
        username:
          type: string
        password:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    SendFriendshipRequestBody:
      type: object
      required: [email]
      properties:
        email:
          type: string

    CreateExpenseBody:
      type: object
      required: [amount, description, type]
      properties:
        amount:
          type: string
          description: Must be > 0 and at most 9,999,999,999
        description:
          type: string
        type:
          type: string
          enum: [PERSONAL, SPLIT, INCOME]
        currency:
          type: string
        note:
          type: string
        expenseDate:
          type: string
          format: date-time
        categoryId:
          type: string
          nullable: true
        groupId:
          type: string
          nullable: true
        userId:
          type: string
          description: Payer. Leave out for "me". Another member is allowed only inside a group you both belong to.
        isSettlement:
          type: boolean
        includeInBudget:
          type: boolean
          description: Whether this transaction counts toward the budget (PERSONAL and INCOME only, defaults to true)
        splits:
          type: array
          description: Only for SPLIT. Amounts must add up to amount; each user once.
          items:
            type: object
            required: [userId, amount]
            properties:
              userId:
                type: string
              amount:
                type: string
              splitType:
                type: string
                enum: [EQUAL, EXACT, PERCENTAGE, SHARES]
              percentage:
                type: string
              isPaid:
                type: boolean

    CreateGroupBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        simplifyDebts:
          type: boolean
        imageUrl:
          type: string
        memberIds:
          type: array
          description: Must all be your accepted friends
          items:
            type: string

    SplitOverview:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    Analytics:
      type: object
      description: Spending = expenses you paid for yourself + your share of split expenses. Settle-ups are never counted.
      properties:
        months:
          type: integer
        trend:
          type: array
          description: One entry per month, oldest first, empty months included
          items:
            type: object
            properties:
              month: {type: string, example: '2026-09'}
              label: {type: string, example: Sep}
              personal: {type: number}
              shared: {type: number, description: my share of split expenses}
              lent: {type: number, description: other people's shares of what I paid}
              income: {type: number}
              spent: {type: number, description: personal + shared}
        categories:
          type: array
          items:
            type: object
            properties:
              categoryId: {type: string}
              name: {type: string}
              color: {type: string}
              amount: {type: number}
        groups:
          type: array
          items:
            type: object
            properties:
              groupId: {type: string}
              name: {type: string}
              amount: {type: number, description: my share}
              total: {type: number, description: whole group}
        comparison:
          type: object
          properties:
            thisMonth: {type: number}
            lastMonth: {type: number}
            changePercent: {type: number, description: 0 when there is no last month to compare}

    SalaryEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: string
          description: Decimal string
        currency:
          type: string
          default: INR
        effectiveFrom:
          type: string
          format: date
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSalaryBody:
      type: object
      required: [amount, effectiveFrom]
      properties:
        amount:
          type: string
          description: Decimal string >= 0
        currency:
          type: string
          default: INR
        effectiveFrom:
          type: string
          example: '2026-01-01'
        note:
          type: string

    UpdateSalaryBody:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
        effectiveFrom:
          type: string
        note:
          type: string

    SavingsAccount:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [BANK, FD, RD, MUTUAL_FUND, CASH, OTHER]
        openingBalance:
          type: string
          description: Decimal string
        balance:
          type: string
          description: Dynamically calculated balance
        currency:
          type: string
          default: INR
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSavingsAccountBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [BANK, FD, RD, MUTUAL_FUND, CASH, OTHER]
          default: OTHER
        openingBalance:
          type: string
          default: '0'
        currency:
          type: string
          default: INR

    UpdateSavingsAccountBody:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [BANK, FD, RD, MUTUAL_FUND, CASH, OTHER]
        openingBalance:
          type: string
        currency:
          type: string

    SavingsTransaction:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        userId:
          type: string
        amount:
          type: string
        direction:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        txnDate:
          type: string
          format: date
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateSavingsTransactionBody:
      type: object
      required: [amount, direction, txnDate]
      properties:
        amount:
          type: string
        direction:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        txnDate:
          type: string
          example: '2026-07-01'
        note:
          type: string

    FinanceSummaryResponse:
      type: object
      properties:
        month:
          type: string
          example: '2026-07'
        salary:
          type: string
          description: Decimal string of active salary for the month
        otherIncome:
          type: string
          description: Decimal string of sum of INCOME expenses in the month
        totalIncome:
          type: string
          description: salary + otherIncome
        totalSpent:
          type: string
          description: All PERSONAL expenses in the month (included and excluded)
        budgetSpent:
          type: string
          description: PERSONAL expenses in the month with include_in_budget=true
        excludedSpent:
          type: string
          description: totalSpent - budgetSpent
        left:
          type: string
          description: totalIncome - totalSpent
        savingsTotal:
          type: string
          description: Total balance across all active savings accounts

